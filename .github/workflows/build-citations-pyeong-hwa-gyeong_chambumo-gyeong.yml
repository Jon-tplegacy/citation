name: Build citation index — pyeong-hwa-gyeong & chambumo-gyeong
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Build citations-pyeong-hwa-gyeong_chambumo-gyeong.json
        run: python build_citations_pyeong-hwa-gyeong_chambumo-gyeong.py
        env:
          GHOST_CONTENT_API_KEY: ${{ secrets.GHOST_CONTENT_API_KEY }}
      - name: Commit citations-pyeong-hwa-gyeong_chambumo-gyeong.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add citations-pyeong-hwa-gyeong_chambumo-gyeong.json
          git diff --staged --quiet || git commit -m "chore: rebuild pyeong-hwa-gyeong/chambumo-gyeong citations index"
          git push
      - name: Purge jsDelivr cache
        run: curl -sf "https://purge.jsdelivr.net/gh/Jon-tplegacy/citation@main/citations-pyeong-hwa-gyeong_chambumo-gyeong.json" || true
